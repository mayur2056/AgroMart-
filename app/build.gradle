plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.agriecommerce'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.agriecommerce"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation libs.core
    implementation libs.activity
    implementation libs.play.services.location

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'


    implementation 'com.airbnb.android:lottie:6.1.0'
    // Firebase BoM (Manages versions automatically)
    implementation platform('com.google.firebase:firebase-bom:33.0.0')

    // Firebase Authentication
    implementation 'com.google.firebase:firebase-auth'

    // Firebase Realtime Database
    implementation 'com.google.firebase:firebase-database'

    // Firebase Firestore (Cloud Database)
    implementation 'com.google.firebase:firebase-firestore'

    // Firebase Storage (File Uploads)
    implementation 'com.google.firebase:firebase-storage'

    // Firebase Cloud Messaging (Push Notifications)
    implementation 'com.google.firebase:firebase-messaging'

    // Firebase Analytics
    implementation 'com.google.firebase:firebase-analytics'

    // Firebase Crashlytics

    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.google.android.gms:play-services-auth:20.7.0'  // Update to latest version
    implementation 'com.google.firebase:firebase-auth:22.1.2'  // Fireb
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    implementation 'com.squareup.okhttp3:okhttp:4.10.0'

    // Commons IO for file utilities
    implementation 'commons-io:commons-io:2.11.0'

    // Cloudinary Android SDK
    implementation 'com.cloudinary:cloudinary-android:3.0.2'


        implementation 'com.razorpay:checkout:1.6.26'


    implementation 'com.sun.mail:android-mail:1.6.2'
    implementation 'com.sun.mail:android-activation:1.6.2'

    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'

}